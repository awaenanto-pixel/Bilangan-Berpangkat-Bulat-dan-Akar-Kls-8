  <meta charset="UTF-8">

  <title>Petualangan Pangkat dan Akar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
  <style>
    :root{--navy:#17345b;--blue:#2563c9;--sky:#eaf4ff;--yellow:#ffdc77;--cream:#fffaf0;--green:#17765b;--red:#a4473d}
    *{box-sizing:border-box}
    body,button,input,select,textarea{font-family:"Nunito",sans-serif}
    body{margin:0;background:#f3f7fc;color:var(--navy);font-size:17px;line-height:1.5}
    button,input,select,textarea{font-size:inherit}
    button{cursor:pointer;border:0}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e79b00;outline-offset:3px}
    .wrap{max-width:1060px;margin:auto;padding:24px}
    header{background:var(--navy);color:white}
    .head{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .brand{font-weight:900;font-size:21px;letter-spacing:-.5px}
    .badge{background:#ffffff20;border-radius:99px;padding:7px 13px;font-size:14px}
    h1{font-size:clamp(30px,5vw,48px);line-height:1.12;margin:12px 0}
    h2{font-size:clamp(26px,4vw,34px);margin:0 0 10px}
    h3{font-size:21px;margin:0 0 9px}
    p{margin:8px 0 16px}
    .muted{color:#55708c}
    .eyebrow{text-transform:uppercase;letter-spacing:.12em;color:var(--blue);font-size:13px;font-weight:900}
    .panel,.card{background:white;border-radius:22px;box-shadow:0 8px 28px #17345b0c;border:1px solid #dce8f5}
    .panel{padding:clamp(22px,5vw,42px);margin:25px 0}
    .card{padding:22px}
    .hero{background:linear-gradient(115deg,#e7f2ff,#fff7dc);border-radius:26px;padding:clamp(25px,5vw,48px);margin:25px 0}
    .hero-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,360px);gap:28px;align-items:center}
    .hero-copy{min-width:0}
    .cube-card{background:#ffffffd9;border:1px solid #cbdff5;border-radius:23px;padding:18px 18px 20px;text-align:center;box-shadow:0 12px 30px #17345b12}
    .cube-card svg{display:block;width:min(100%,260px);height:auto;margin:0 auto 2px;filter:drop-shadow(0 9px 7px #17345b20)}
    .cube-card .cube-label{display:inline-block;background:#fff0bd;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:900;color:#695015}
    .cube-equation{font-weight:900;color:#154b9c;font-size:clamp(20px,2.4vw,26px);margin:8px 0 2px;white-space:nowrap}
    .cube-caption{font-size:14px;color:#445f7c;margin:0;line-height:1.4}
    @media(max-width:760px){.hero-layout{grid-template-columns:1fr}.cube-card{max-width:390px;width:100%;margin:auto}}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
    .menu-card{text-align:left;color:var(--navy);width:100%;min-height:168px;background:white;border:2px solid #d9e7f7;border-radius:22px;padding:22px;transition:transform .15s,border-color .15s}
    .menu-card:hover{transform:translateY(-3px);border-color:var(--blue)}
    .menu-icon{display:block;font-size:31px;margin-bottom:12px}
    .menu-card strong{display:block;font-size:20px}
    .menu-card small{display:block;color:#607994;margin-top:5px;font-size:14px}
    .status{display:inline-block;background:#e7f3ff;color:#1554a8;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:900;margin-top:12px}
    .status.done{background:#dcf6e9;color:#116342}
    .btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;background:var(--blue);color:white;border-radius:13px;padding:12px 20px;min-height:48px;font-weight:900}
    .btn:hover{background:#184eab}
    .btn.secondary{background:#e5effb;color:var(--navy)}
    .btn.secondary:hover{background:#d4e5f9}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
    label{display:block;font-weight:800;margin:15px 0 6px}
    input,select,textarea{width:100%;border:2px solid #cbdced;border-radius:12px;padding:12px;background:white;color:var(--navy)}
    textarea{min-height:80px;resize:vertical}
    .login{max-width:590px;margin:40px auto}
    .question{background:var(--sky);border-radius:18px;padding:22px;margin:20px 0;font-size:clamp(20px,3vw,27px);font-weight:900}
    .choices{display:grid;gap:10px}
    .choice{width:100%;text-align:left;padding:14px 18px;background:white;border:2px solid #d7e4f1;border-radius:13px;color:var(--navy);font-weight:800;min-height:50px}
    .choice:hover:not(:disabled),.choice.selected{border-color:var(--blue);background:#eaf4ff}
    .choice.correct{border-color:var(--green);background:#e4f7ed}
    .choice.wrong{border-color:var(--red);background:#fff0ed}
    .feedback{padding:14px 17px;border-radius:12px;background:#e8f6ee;color:#135c44;font-weight:800;margin-top:16px}
    .feedback.try{background:#fff2e9;color:#8b4930}
    .progress{height:12px;background:#dce8f4;border-radius:99px;overflow:hidden}
    .progress span{display:block;height:100%;background:#2ba87d;border-radius:99px;transition:width .2s}
    .small{font-size:14px}
    .math{font-size:clamp(25px,4vw,38px);font-weight:900;color:#1558b4;letter-spacing:.02em}
    .illustration{padding:20px;background:var(--sky);border-radius:18px;margin:20px 0}
    .tiles{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
    .tile{width:42px;height:42px;background:#ffc956;border:2px solid #d89617;border-radius:8px;display:grid;place-items:center;font-weight:900}
    .steps{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
    .step{background:white;border:2px solid #c9dff7;border-radius:12px;padding:11px 15px;font-weight:900}
    .numberline{display:flex;justify-content:space-between;border-top:3px solid #3675c1;margin:26px 5px 8px;padding-top:8px;font-weight:900}
    .numberline .mark{position:relative}
    .numberline .mark:before{content:"";height:10px;width:3px;background:#3675c1;position:absolute;top:-18px;left:50%}
    .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .tag{display:inline-block;background:#fff0bd;border-radius:9px;padding:5px 10px;font-weight:900;margin:4px}
    footer{text-align:center;color:#5e7690;padding:24px;font-size:14px}
    @media(max-width:600px){.wrap{padding:16px}.two{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.panel{margin:16px 0}.menu-card{min-height:140px}}

ss="menu-icon" aria-hidden="true">${icon}</span><strong>${title}</strong><small>${desc}</small><span class="status ${state.done.has(key)?'done':''}">${state.done.has(key)?'✓ Selesai':state.opened.has(key)?'Sudah dibuka':'Belum dibuka'}</span></button>`).join('')}</div></section>`;

  const slides=[
    {title:'1. Apa itu pangkat?',text:'Pangkat adalah cara singkat menulis perkalian bilangan yang sama.',example:'2 × 2 × 2 = 2³ = 8',visual:'<div class="tiles"><span class="tile">2</span><span class="tile">×</span><span class="tile">2</span><span class="tile">×</span><span class="tile">2</span></div><span class="tag">3 kali angka 2</span>',tip:'Basis 2 dikalikan berulang sebanyak 3 kali.'},

    {title:'4. Pangkat nol dan negatif',text:'Bilangan bukan nol berpangkat 0 bernilai 1. Pangkat negatif berarti bentuk kebalikan.',example:'3⁰ = 1 · 2⁻³ = 1/2³ = 1/8',visual:'<div class="numberline"><span class="mark">2⁻²</span><span class="mark">2⁻¹</span><span class="mark">2⁰</span><span class="mark">2¹</span><span class="mark">2²</span></div><div class="steps"><span class="step">1/4</span><span class="step">1/2</span><span class="step">1</span><span class="step">2</span><span class="step">4</span></div>',tip:'Bergerak ke kiri pada tangga 2: bagi 2 setiap langkah.'},
    {title:'5. Perkalian dan pembagian',text:'Jika basis sama, saat dikali pangkatnya dijumlah. Saat dibagi pangkatnya dikurang.',example:'2³ × 2² = 2⁵ = 32 · 5⁴ ÷ 5² = 5² = 25',visual:'<div class="steps"><span class="step">Kali → tambah pangkat</span><span class="step">Bagi → kurang pangkat</span></div>',tip:'Aturan ini dipakai bila basisnya sama. Untuk pembagian, basis tidak boleh nol.'},
    {title:'6. Sifat pangkat lainnya',text:'Pangkat dari pangkat: kalikan pangkatnya. Pangkat pada perkalian atau pembagian berlaku pada tiap faktor.',example:'(2²)³ = 2⁶ = 64 · (2 × 3)² = 2² × 3² = 36',visual:'<div class="steps"><span class="step">(aᵐ)ⁿ = aᵐⁿ</span><span class="step">(ab)ⁿ = aⁿbⁿ</span><span class="step">(a/b)ⁿ = aⁿ/bⁿ</span></div>',tip:'Contoh pembagian: (6/3)² = 6²/3² = 4, dengan penyebut tidak nol.'},

  function materi(){

  function simulationResult(){

  const puzzles=[

    if(state.puzzlePicks.length===3){state.puzzleScore++;state.puzzleIndex++;state.puzzlePicks=[];renderGame();if(state.puzzleIndex<puzzles.length){document.getElementById('game-content').insertAdjacentHTML('afterbegin','<div class="feedback">Urutan tepat! Lanjut ke puzzle berikutnya. 🎉</div>')}return}
    renderGame();
  }
  function retryPuzzle(){state.puzzlePicks=[];renderGame()}
  function resetPuzzle(){state.puzzleIndex=0;state.puzzleScore=0;state.puzzlePicks=[];renderGame()}
  function resetMatch(){state.matchScore=0;state.matchPick=null;state.matchSolved=new Set();state.matchOrder=[3,0,5,2,1,4];renderGame()}
  function renderMatch(){
    if(!state.matchOrder.length)state.matchOrder=[3,0,5,2,1,4];
    document.getElementById('game-content').innerHTML=`<article class="panel canva-panel"><h2>🃏 Matching Game</h2><p>Pilih satu ekspresi di kiri, lalu pilih hasil yang cocok di kanan.</p><p><strong>Skor: ${state.matchScore}/6 pasangan</strong></p><div class="two"><div class="choices">${pairs.map((p,i)=>`<button type="button" class="choice canva-button ${state.matchPick===i?'selected':''}" ${state.matchSolved.has(i)?'disabled':''} onclick="pickExpression(${i})">${state.matchSolved.has(i)?'✓ ':''}${p[0]}</button>`).join('')}</div><div class="choices">${state.matchOrder.map(i=>`<button type="button" class="choice canva-button" ${state.matchSolved.has(i)?'disabled':''} onclick="pickResult(${i})">${state.matchSolved.has(i)?'✓ ':''}${pairs[i][1]}</button>`).join('')}</div></div><div id="match-feedback" aria-live="polite">${state.matchScore===6?'<div class="feedback">Semua pasangan ditemukan! Hebat! 🎉</div>':''}</div><div class="actions">${button('Mulai ulang matching','resetMatch()',true)}</div></article>`;
  }
  function pickExpression(i){state.matchPick=i;renderMatch()}
  function pickResult(i){
    const box=document.getElementById('match-feedback');
    if(state.matchPick===null){box.innerHTML='<div class="feedback try">Pilih ekspresi di kiri terlebih dahulu.</div>';return}
    if(state.matchPick===i){state.matchSolved.add(i);state.matchScore++;state.matchPick=null;if(state.matchScore===6)state.done.add('game');renderMatch();if(state.matchScore<6)document.getElementById('match-feedback').innerHTML='<div class="feedback">Cocok! Cari pasangan berikutnya. 🎉</div>'}
    else box.innerHTML='<div class="feedback try">Belum cocok. Coba hitung ekspresinya sekali lagi.</div>';
  }
  function refleksi(){
    frame('Refleksi','Tidak ada jawaban salah. Ceritakan pengalaman belajarmu.',`<form id="reflection-form"><label for="understanding">Seberapa paham kamu sekarang?</label><select id="understanding" class="canva-dropdown" required><option value="">Pilih tingkat pemahaman</option><option value="1">1 — Masih perlu bantuan</option><option value="2">2 — Mulai mengenal</option><option value="3">3 — Cukup paham</option><option value="4">4 — Paham dan bisa mencoba</option><option value="5">5 — Bisa menjelaskan kembali</option></select><label for="feeling">Bagaimana perasaanmu?</label><select id="feeling" class="canva-dropdown" required><option value="">Pilih perasaan</option><option>Senang 😊</option><option>Penasaran 🤔</option><option>Masih bingung 😵‍💫</option><option>Lebih percaya diri 🌟</option></select><label for="understood">Hal yang paling saya pahami</label><textarea id="understood" class="canva-input" maxlength="300" required placeholder="Contoh: mencari akar dari 25"></textarea><label for="confusing">Hal yang masih membingungkan</label><textarea id="confusing" class="canva-input" maxlength="300" required placeholder="Tuliskan singkat. Boleh juga tulis: belum ada."></textarea><label for="next-plan">Rencana saya berikutnya</label><textarea id="next-plan" class="canva-input" maxlength="300" required placeholder="Contoh: mencoba lagi simulasi pangkat"></textarea><div id="reflection-message" aria-live="polite"></div><div class="actions"><button id="reflection-submit" type="submit" class="btn canva-button">Kirim refleksi →</button></div></form>`);
    document.getElementById('reflection-form').onsubmit=submitReflection;
  }
  async function submitReflection(e){
    e.preventDefault();
    const msg=document.getElementById('reflection-message'),btn=document.getElementById('reflection-submit');
    if(!sdkReady){msg.innerHTML='<div class="feedback try">Belum dapat menyimpan jawaban. Periksa koneksi, lalu coba lagi.</div>';return}
    btn.disabled=true;btn.textContent='Menyimpan…';
    try{
      const r=await window.dataSdk.create({nama_siswa:state.name,asal_sekolah:state.school,pemahaman:Number(document.getElementById('understanding').value),perasaan:document.getElementById('feeling').value,paling_dipahami:document.getElementById('understood').value.trim(),masih_membingungkan:document.getElementById('confusing').value.trim(),rencana_berikutnya:document.getElementById('next-plan').value.trim(),dikirim_pada:new Date().toISOString()});
      if(!r.isOk)throw new Error('Gagal menyimpan');
      state.done.add('refleksi');
      document.getElementById('reflection-form').innerHTML=`<div class="feedback">Terima kasih, ${esc(state.name)}! Refleksimu sudah tersimpan. Setiap langkah kecil membantumu semakin paham. Terus mencoba, ya! 🌟</div><div class="actions">${homeButton()}</div>`;
    }catch(err){msg.innerHTML='<div class="feedback try">Refleksi belum tersimpan. Coba kirim sekali lagi.</div>';btn.disabled=false;btn.textContent='Kirim refleksi →'}
  }
  function finish(key){state.done.add(key);show('home')}
  show('login');
</script>
 </body>
</html>
